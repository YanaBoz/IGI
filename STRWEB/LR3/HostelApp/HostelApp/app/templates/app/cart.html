{% extends "app/layout.html" %}

{% block content %}
<h1>Cart</h1>

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Cap</th>
            <th>Price</th>
            <th>Total</th>
            <th>Del</th>
        </tr>
    </thead>
    <tbody>
        {% for cart_item in cart_items %}
        <tr>
            <td>{{ cart_item.product.name }}</td>
            <td>{{ cart_item.quantity }}</td>
            <td>{{ cart_item.product.price }}</td>
            <td>{{ cart_item.item_price }}</td>
            <td><a href="{% url 'remove_from_cart' cart_item.id %}">Del</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<p>Total: {{ total_price }}</p>

<a href="{% url 'checkout' %}">Confirm</a>
{% endblock %}
